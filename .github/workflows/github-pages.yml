name: Deploy Reality .25 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install runtime dependency
        run: npm install

      - name: Prepare static Reality .25 site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -R public/. site/
          cp reality-lattice.js reality-field.js reality-controller.js reality-field-scene.js site/
          mkdir -p site/node_modules/three
          cp -R node_modules/three/. site/node_modules/three/


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
